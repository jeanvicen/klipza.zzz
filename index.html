<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Klipza.IA</title>
<style>
:root{
  --bg:#fff;--panel:#fafafa;--panel2:#f4f4f4;--line:#e5e5e5;--line2:#d8d8d8;
  --text:#111;--muted:#747474;--black:#000;--hover:#f0f0f0;--radius:14px;
  --sidebar:300px;--content:820px;--danger:#b00020;
}
body.dark{
  --bg:#0b0b0b;--panel:#111;--panel2:#171717;--line:#262626;--line2:#333;
  --text:#f3f3f3;--muted:#9a9a9a;--black:#fff;--hover:#1b1b1b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer}
svg{display:block}
.hidden{display:none!important}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:24px}
.login-card{width:min(390px,100%);text-align:center}
.login-brand{font-size:34px;line-height:1;font-weight:700;letter-spacing:-1.8px;margin-bottom:12px}
.login-brand span{font-weight:400}
.login-copy{font-size:14px;color:var(--muted);margin-bottom:28px}
.google-btn{width:100%;height:50px;border:1px solid var(--black);border-radius:11px;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;gap:11px;font-size:14px;font-weight:600;transition:.16s}
.google-btn:hover{background:#000;color:#fff}
.google-btn:active{transform:translateY(1px)}
.google-icon{width:18px;height:18px}
.login-note{font-size:11px;line-height:1.6;color:var(--muted);margin-top:18px}

/* APP */
#app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);height:100dvh;width:100%;transition:grid-template-columns .2s ease}
#app.sidebar-collapsed{grid-template-columns:0 minmax(0,1fr)}
.sidebar{height:100dvh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:transform .22s ease,opacity .18s ease}
#app.sidebar-collapsed .sidebar{transform:translateX(-100%);opacity:0;pointer-events:none}
.side-head{height:58px;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-size:17px;font-weight:700;letter-spacing:-.5px;flex:1}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:17px;height:17px}
.new-chat{margin:12px;height:42px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600}
.new-chat:hover{border-color:#000;background:#000;color:#fff}
.nav{padding:4px 9px 8px}
.nav-btn{width:100%;height:40px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:10px;text-align:left;font-size:13px;color:#444}
.nav-btn:hover{background:var(--hover);color:#000}
.nav-btn.active{background:#000;color:#fff}
.nav-btn svg{width:16px;height:16px;flex:0 0 auto}
.nav-label{flex:1}
.nav-count{font-size:10px;opacity:.65}
.history-head{padding:12px 14px 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#999;font-weight:700}
.history{flex:1;overflow:auto;padding:2px 9px 10px}
.chat-row{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 7px 0 10px;border-radius:9px;color:#333;margin:2px 0}
.chat-row:hover{background:var(--hover)}
.chat-row.active{background:#e9e9e9;color:#000}
.chat-title{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.row-actions{display:none;align-items:center;gap:1px}
.chat-row:hover .row-actions,.chat-row.active .row-actions{display:flex}
.row-action{width:27px;height:27px;border-radius:7px;display:grid;place-items:center}
.row-action:hover{background:#fff}
.rename-input{min-width:0;width:100%;height:28px;border:1px solid #000;border-radius:7px;background:#fff;padding:0 7px;font-size:13px}
.account{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;}
.account:focus-visible{outline:2px solid #000;outline-offset:2px;}
.side-bottom{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.account{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px}
.account:hover{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.account-copy{min-width:0;flex:1}
.account-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-email{font-size:10px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* MAIN */
.main{height:100dvh;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 clamp(14px,2vw,28px);flex:0 0 auto}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.topbar-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-sub{font-size:11px;color:#999}
.topbar-right{display:flex;gap:5px;align-items:center}

.messages{flex:1;overflow:auto;padding:clamp(22px,3vw,38px) 0 18px;scroll-behavior:smooth}
.msg-width{width:min(var(--content),calc(100% - 38px));margin:0 auto}
.msg{display:flex;gap:12px;margin:0 0 30px}
.msg:last-child{margin-bottom:4px}
.msg-avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:11px;font-weight:700;margin-top:2px}
.msg.user .msg-avatar{background:#000;color:#fff}
.msg.ai .msg-avatar{border:1px solid #000;background:#fff}
.msg-content{min-width:0;flex:1;font-size:15px;line-height:1.7}
.msg-label{font-size:11px;font-weight:700;margin-bottom:4px;color:#777}
.msg-content p{margin-bottom:10px}.msg-content p:last-child{margin-bottom:0}
.msg-content pre{background:#f6f6f6;border:1px solid #dedede;border-radius:10px;padding:13px;overflow:auto;margin:10px 0;font-size:12px;line-height:1.55}
.msg-content code{background:#f0f0f0;padding:2px 5px;border-radius:5px;font-size:.9em}
.msg-content ul{padding-left:20px;margin:8px 0}

.welcome{min-height:100%;display:grid;place-items:center;padding:35px 18px}
.welcome-inner{width:min(690px,100%);text-align:center}
.welcome-mark{width:54px;height:54px;border:1px solid #111;border-radius:16px;margin:0 auto 18px;display:grid;place-items:center;font-size:20px;font-weight:700}
.welcome h1{font-size:28px;letter-spacing:-.9px;margin-bottom:8px}
.welcome p{font-size:13px;color:#777;margin-bottom:24px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.suggestion{min-height:72px;border:1px solid var(--line);border-radius:12px;text-align:left;padding:13px;background:var(--bg);transition:.15s}
.suggestion:hover{border-color:#000;background:#fafafa}
.suggestion strong{display:block;font-size:12px;margin-bottom:4px}
.suggestion span{font-size:11px;line-height:1.5;color:#777}

.composer-wrap{padding:12px 16px 16px;flex:0 0 auto}
.composer{width:min(var(--content),100%);margin:0 auto}
.composer-box{border:1px solid var(--black);border-radius:16px;background:var(--bg);box-shadow:0 2px 16px rgba(0,0,0,.05)}
.attach-strip{display:none;padding:10px 11px;border-bottom:1px solid var(--line);gap:7px;flex-wrap:wrap}
.attach-strip.open{display:flex}
.attach-chip{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;background:#f0f0f0;font-size:11px}
.attach-chip button{font-size:15px;color:#666}
.attach-menu{display:none;padding:9px;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap}
.attach-menu.open{display:flex}
.attach-option{flex:1 1 145px;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;align-items:center;gap:9px;text-align:left}
.attach-option:hover{background:#fafafa;border-color:#000}
.attach-option-icon{width:30px;height:30px;border-radius:8px;background:#000;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.attach-option-icon svg{width:14px;height:14px}
.attach-option-title{font-size:12px;font-weight:600}.attach-option-sub{font-size:10px;color:#888;margin-top:1px}
.composer-row{display:flex;align-items:flex-end;gap:7px;padding:7px}
.plus{width:37px;height:37px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.plus:hover{background:#f0f0f0}.plus.active{background:#000;color:#fff}
.plus svg{width:18px;height:18px}
textarea#prompt{flex:1;resize:none;border:0;outline:0;background:transparent;padding:8px 6px;min-height:37px;max-height:180px;font-size:14px;line-height:1.5}
.send{width:37px;height:37px;border-radius:10px;background:#000;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.send:disabled{background:#ccc;cursor:not-allowed}
.composer-note{text-align:center;font-size:10px;color:#aaa;margin-top:7px}

/* ARTIFACTS */
.artifacts-view{height:100%;overflow:auto;padding:32px 20px 60px}
.artifacts-inner{width:min(880px,100%);margin:0 auto}
.page-title{font-size:26px;letter-spacing:-.7px;margin-bottom:4px}.page-sub{font-size:13px;color:#777;margin-bottom:24px}
.artifact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.artifact-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);min-height:150px;display:flex;flex-direction:column;gap:11px;cursor:pointer}
.artifact-card:hover{border-color:#000}
.artifact-head{display:flex;align-items:center;gap:9px}.artifact-icon{width:34px;height:34px;background:#000;color:#fff;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700}.artifact-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artifact-meta{font-size:10px;color:#999;margin-top:2px}.artifact-preview{font-size:11px;color:#666;line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.empty-page{padding:60px 10px;text-align:center;color:#999;font-size:13px;border:1px dashed #ddd;border-radius:14px}

/* SETTINGS — REDESIGN */
.settings-view{height:100%;overflow:auto;background:var(--bg);padding:28px 30px 60px}
.settings-inner{width:min(1180px,100%);margin:0 auto}
.settings-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 20px}
.settings-top-main{display:flex;align-items:center;gap:14px;min-width:0}
.settings-avatar{width:48px;height:48px;border-radius:14px;background:var(--black);color:var(--bg);display:grid;place-items:center;font-size:15px;font-weight:800;flex:0 0 auto}
.settings-head{min-width:0}.settings-title{font-size:24px;font-weight:700;letter-spacing:-.6px}.settings-subtitle{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings-back{padding:9px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);font-size:11px;font-weight:700;white-space:nowrap}.settings-back:hover{background:var(--black);color:var(--bg);border-color:var(--black)}
.settings-nav{display:flex;align-items:center;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:auto;scrollbar-width:none;position:sticky;top:0;z-index:3}.settings-nav::-webkit-scrollbar{display:none}
.settings-nav a{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:8px;color:var(--muted);font-size:11px;font-weight:650;text-decoration:none;white-space:nowrap;transition:.15s}.settings-nav a:hover{background:var(--hover);color:var(--text)}.settings-nav a.active{background:var(--black);color:var(--bg)}
.settings-sections{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:14px;align-items:start}
.settings-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;scroll-margin-top:74px}
.settings-card.full{grid-column:1 / -1}.settings-card-header{padding:17px 18px 12px;border-bottom:1px solid var(--line)}
.settings-card-title{font-size:13px;font-weight:750}.settings-card-desc{font-size:11px;line-height:1.5;color:var(--muted);margin-top:4px}
.settings-rows{padding:0 18px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:64px;padding:13px 0;border-top:1px solid var(--line)}.settings-row:first-child{border-top:0}
.settings-copy{min-width:0}.settings-name{font-size:12px;font-weight:650}.settings-detail{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px;overflow-wrap:anywhere}
.settings-control{flex:0 0 auto;display:flex;align-items:center;gap:8px}.settings-value{font-size:11px;font-weight:600;color:var(--muted);text-align:right;max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-action{padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);font-size:11px;font-weight:650;white-space:nowrap}.settings-action:hover{background:var(--black);color:var(--bg);border-color:var(--black)}
.settings-action.danger{border-color:var(--black)}
.settings-energy{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-meter{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}.settings-meter-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.settings-meter-name{font-size:12px;font-weight:700}.settings-meter-desc{font-size:10px;color:var(--muted);line-height:1.45;margin-top:3px}.settings-meter-value{font-size:19px;font-weight:750;white-space:nowrap}.settings-track{height:7px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:12px}.settings-track span{display:block;height:100%;background:var(--black);border-radius:999px;transition:width .25s}.settings-meter-foot{font-size:10px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.settings-themes{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.theme-card{border:1px solid var(--line);border-radius:13px;background:var(--bg);padding:10px;text-align:left;transition:.15s}.theme-card:hover{border-color:var(--black)}.theme-card.active{border:2px solid var(--black);padding:9px}.theme-swatch{height:92px;border-radius:9px;display:flex;align-items:flex-end;padding:12px;font-size:14px;font-weight:700;letter-spacing:-.2px}.theme-swatch.light{background:#fff;color:#111;border:1px solid #eee}.theme-swatch.dark{background:#0b0b0b;color:#fff;border:1px solid #222}.theme-name{font-size:12px;font-weight:700;margin-top:10px}.theme-desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.settings-foot{font-size:10px;color:var(--muted);text-align:center;padding:18px 0 6px}
@media(max-width:980px){.settings-sections{grid-template-columns:1fr}.settings-card.full{grid-column:auto}.settings-energy{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.settings-view{padding:16px 12px 42px}.settings-top{padding:8px 0 14px;align-items:flex-start}.settings-title{font-size:21px}.settings-subtitle{white-space:normal}.settings-back{padding:8px 10px}.settings-nav{margin-bottom:12px}.settings-nav a{padding:9px 12px;font-size:10px}.settings-sections{gap:10px}.settings-card{border-radius:13px}.settings-card-header{padding:15px}.settings-rows{padding:0 15px}.settings-row{align-items:flex-start;flex-direction:column;gap:10px;padding:14px 0}.settings-control{width:100%;justify-content:flex-start}.settings-value{max-width:none;text-align:left;white-space:normal}.settings-action{width:auto}.settings-energy,.settings-themes{padding:12px 15px;grid-template-columns:1fr}.theme-swatch{height:78px}.settings-avatar{width:44px;height:44px;border-radius:12px;font-size:14px}}

/* MOBILE */
.mobile-close{display:none}
@media (max-width:900px){
  :root{--sidebar:280px}
  .artifact-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:30;left:0;top:0;width:min(88vw,300px);box-shadow:14px 0 30px rgba(0,0,0,.12)}
  #app.sidebar-collapsed{grid-template-columns:1fr}
  #app.sidebar-collapsed .sidebar{transform:translateX(-104%);opacity:1;pointer-events:none}
  .main{width:100vw}
  .mobile-close{display:grid}
  .topbar{padding:0 12px;height:54px}.topbar-right .desktop-only{display:none}
  .messages{padding-top:20px}.msg-width{width:calc(100% - 24px)}
  .msg{gap:9px;margin-bottom:24px}.msg-content{font-size:14px}.msg-avatar{width:27px;height:27px}
  .welcome{padding:28px 14px}.welcome h1{font-size:24px}.suggestions{grid-template-columns:1fr}
  .composer-wrap{padding:10px 9px max(12px,env(safe-area-inset-bottom))}.composer-note{font-size:9px}
  .attach-option{flex-basis:100%}.artifact-grid{grid-template-columns:1fr}.artifacts-view,.settings-view{padding:24px 14px 50px}
}
@media (min-width:721px){#app.sidebar-collapsed .topbar .menu-toggle{display:grid}}

/* NO MODALS: all views are inside the main area */

/* ENERGY SYSTEM */
.energy-card{margin:12px 14px 10px;padding:13px;border:1px solid #e7e7e7;border-radius:14px;background:#fff}
.energy-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.energy-title{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#555}
.energy-value{font-size:13px;font-weight:700}
.energy-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.energy-ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#000 var(--pct),#ededed 0);position:relative;flex:0 0 44px}
.energy-ring:after{content:"";width:32px;height:32px;background:var(--bg);border-radius:50%;position:absolute}
.energy-ring span{position:relative;z-index:1;font-size:10px;font-weight:700}
.energy-copy{min-width:0;flex:1}
.energy-label{font-size:12px;font-weight:600}
.energy-meta{font-size:10px;color:#888;margin-top:3px}
.energy-bar{height:5px;border-radius:999px;background:#ececec;overflow:hidden;margin-top:9px}
.energy-bar span{display:block;height:100%;background:#000;border-radius:999px;transition:width .25s}
.energy-foot{margin-top:7px;font-size:9px;color:#8a8a8a;display:flex;justify-content:space-between;gap:8px}
.quota-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid #e8e8e8;border-radius:9px;background:#fafafa;font-size:10px;color:#555}
.quota-dot{width:6px;height:6px;border-radius:50%;background:#000}
.limit-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.limit-card + .limit-card{margin-top:10px}
.limit-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.limit-name{font-size:13px;font-weight:700}
.limit-caption{font-size:11px;color:#858585;margin-top:3px;line-height:1.45}
.limit-number{font-size:18px;font-weight:700;white-space:nowrap}
.limit-track{height:7px;border-radius:999px;background:#efefef;overflow:hidden;margin-top:12px}
.limit-track > span{height:100%;display:block;background:#000;border-radius:999px;transition:width .2s}
.limit-note{margin-top:8px;font-size:10px;color:#8a8a8a}
.settings-kicker{font-size:11px;color:#888;margin-top:4px}

</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-brand">Klipza<span>.IA</span></div>
    <div class="login-copy">Entre na sua conta para continuar.</div>
    <button class="google-btn" id="googleBtn">
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M21.35 12.23c0-.72-.06-1.25-.19-1.82H12v3.44h5.36a4.58 4.58 0 0 1-1.99 3.01v2.5h3.22c1.89-1.74 2.76-4.3 2.76-7.13Z"/>
        <path fill="#34A853" d="M12 21.75c2.7 0 4.97-.89 6.63-2.4l-3.22-2.5c-.89.59-2.03 1.01-3.41 1.01-2.61 0-4.82-1.76-5.61-4.13H3.06v2.57A10.01 10.01 0 0 0 12 21.75Z"/>
        <path fill="#FBBC05" d="M6.39 13.73A6.03 6.03 0 0 1 6.07 12c0-.6.11-1.18.32-1.73V7.7H3.06A9.99 9.99 0 0 0 2 12c0 1.61.39 3.13 1.06 4.3l3.33-2.57Z"/>
        <path fill="#EA4335" d="M12 6.14c1.47 0 2.79.51 3.83 1.5l2.87-2.87C16.96 3.16 14.7 2.25 12 2.25a10.01 10.01 0 0 0-8.94 5.48l3.33 2.57C7.18 7.9 9.39 6.14 12 6.14Z"/>
      </svg>
      Continuar com Google
    </button>
    <div class="login-note">Ao continuar, você concorda com os Termos e com a Política de Privacidade do Klipza.IA.</div>
  </div>
</div>

      Nova conversa

<input class="hidden" id="fileInput" type="file">
<input class="hidden" id="imageInput" type="file" accept="image/*">
<input class="hidden" id="cameraInput" type="file" accept="image/*" capture="environment">

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'klipza_pro_v1';
  let state = loadState();
  state.theme = state.theme || 'light';
  const ENERGY_MAX=100, MSG_COST=2, ATTACH_LIMIT=3, CYCLE_MS=24*60*60*1000;
  let currentView = 'chat';
  let activeChatId = state.activeChatId || null;
  let attached = [];

  function loadState(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {user:null,chats:{},artifacts:{},activeChatId:null,quota:null,theme:'light'};
  }

  function ensureQuota(){
    state.quota=state.quota||{energy:ENERGY_MAX,attachUsed:0,resetAt:Date.now()+CYCLE_MS};
    const now=Date.now();
    if(!state.quota.resetAt || now>=state.quota.resetAt){
      state.quota={energy:ENERGY_MAX,attachUsed:0,resetAt:now+CYCLE_MS};
      save();
    }
  }
  function timeLeft(ms){
    const total=Math.max(0,Math.floor(ms/1000));
    const h=Math.floor(total/3600), m=Math.floor((total%3600)/60);
    if(h>=1) return `${h}h ${String(m).padStart(2,'0')}min`;
    return `${m}min`;
  }
  function energyPercent(){ensureQuota(); return Math.max(0,Math.min(100,state.quota.energy));}
  function quotaHTML(compact=false){
    ensureQuota();
    const pct=energyPercent();
    const attachPct=Math.max(0,Math.min(100,((ATTACH_LIMIT-state.quota.attachUsed)/ATTACH_LIMIT)*100));
    return `<div class="energy-card">
      <div class="energy-head"><div class="energy-title">Energia</div><div class="energy-value">${state.quota.energy}</div></div>
      <div class="energy-row"><div class="energy-ring" style="--pct:${pct}%"><span>${pct}</span></div><div class="energy-copy"><div class="energy-label">Uso diário</div><div class="energy-meta">${state.quota.energy>=MSG_COST?'Pronta para a próxima mensagem':'Sem energia no momento'}</div></div></div>
      <div class="energy-bar"><span style="width:${pct}%"></span></div>
      <div class="energy-foot"><span>Recarrega em ${timeLeft(state.quota.resetAt-Date.now())}</span><span>${state.quota.attachUsed}/${ATTACH_LIMIT} anexos</span></div>
    </div>`;
  }
  function refreshQuotaUI(){
    ensureQuota();
    const side=document.getElementById('sideQuota'); if(side) side.innerHTML=quotaHTML(true);
    const energy=document.getElementById('energySettings'); if(energy) energy.innerHTML=renderEnergySettings();
    const status=document.getElementById('composerQuota'); if(status){
      status.innerHTML=`<span class="quota-dot"></span> ${state.quota.energy} energia · ${ATTACH_LIMIT-state.quota.attachUsed} anexos disponíveis · recarrega em ${timeLeft(state.quota.resetAt-Date.now())}`;
    }
  }
  function renderEnergySettings(){
    ensureQuota();
    return `<div class="limit-card"><div class="limit-top"><div><div class="limit-name">Energia diária</div><div class="limit-caption">100 pontos por ciclo de 24 horas. Cada mensagem consome ${MSG_COST} pontos.</div></div><div class="limit-number">${state.quota.energy}</div></div><div class="limit-track"><span style="width:${energyPercent()}%"></span></div><div class="limit-note">Até 50 mensagens por ciclo, dependendo do consumo.</div></div>
    <div class="limit-card"><div class="limit-top"><div><div class="limit-name">Anexos</div><div class="limit-caption">Câmera, fotos e arquivos compartilham o mesmo limite diário.</div></div><div class="limit-number">${ATTACH_LIMIT-state.quota.attachUsed}</div></div><div class="limit-track"><span style="width:${((ATTACH_LIMIT-state.quota.attachUsed)/ATTACH_LIMIT)*100}%"></span></div><div class="limit-note">Limite renovado junto com a energia.</div></div>`;
  }
  function applyTheme(){
    const dark=state.theme==='dark';
    document.body.classList.toggle('dark',dark);
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#0b0b0b':'#ffffff');
  }
  function setTheme(theme){
    state.theme=theme==='dark'?'dark':'light';
    save(); applyTheme();
    if(currentView==='settings') renderSettingsPage();
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(state));}
  function uid(prefix){return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7)}
  function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
  function initials(name){return (name||'K').trim().charAt(0).toUpperCase()}

  function loginDemo(){
    state.user = {name:'Usuário Google',email:'usuario@gmail.com'};
    save(); enter();
  }
  function enter(){
    ensureQuota();
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('accountName').textContent=state.user.name;
    $('accountEmail').textContent=state.user.email;
    $('avatar').textContent=initials(state.user.name);
    renderHistory(); renderArtifactsCount();
    if(!Object.keys(state.chats).length) createChat();
    else { activeChatId=state.activeChatId || Object.keys(state.chats)[0]; save(); renderChat(); }
    adaptSidebar();
  }
  function logout(){
    state.user=null; save(); location.reload();
  }

  function adaptSidebar(){
    if(window.innerWidth<=720) $('app').classList.add('sidebar-collapsed');
  }
  window.addEventListener('resize',adaptSidebar);

  function setView(view){
    currentView=view;
    document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
    if(view==='chat') renderChat();
    if(view==='artifacts') renderArtifactsPage();
    if(view==='settings') renderSettingsPage();
    if(window.innerWidth<=720) $('app').classList.add('sidebar-collapsed');
  }
  function toggleSidebar(){ $('app').classList.toggle('sidebar-collapsed'); }

  function createChat(){
    const id=uid('chat');
    state.chats[id]={id,title:'Nova conversa',messages:[],created:Date.now(),updated:Date.now()};
    activeChatId=id; state.activeChatId=id; save(); renderHistory(); setView('chat');
  }
  function openChat(id){activeChatId=id;state.activeChatId=id;save();setView('chat');renderHistory();}
  function deleteChat(id){
    delete state.chats[id];
    const ids=Object.keys(state.chats).sort((a,b)=>state.chats[b].updated-state.chats[a].updated);
    activeChatId=ids[0]||null; state.activeChatId=activeChatId; save(); renderHistory();
    if(!activeChatId) createChat(); else renderChat();
  }
  function renameChat(id){
    const row=document.querySelector(`[data-chat-id="${id}"]`); if(!row)return;
    const title=row.querySelector('.chat-title'); const old=state.chats[id].title;
    title.innerHTML=`<input class="rename-input" value="${esc(old)}">`;
    const input=title.querySelector('input'); input.focus(); input.select();
    const finish=()=>{const v=input.value.trim()||old;state.chats[id].title=v;state.chats[id].updated=Date.now();save();renderHistory();renderChat()};
    input.addEventListener('blur',finish,{once:true});
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish()} if(e.key==='Escape'){input.value=old;input.blur()}});
  }
  function clearHistory(){
    if(!confirm('Apagar todo o histórico de conversas?')) return;
    state.chats={};activeChatId=null;state.activeChatId=null;save();renderHistory();createChat();
  }
  function renderHistory(){
    const box=$('history'); const ids=Object.keys(state.chats).sort((a,b)=>state.chats[b].updated-state.chats[a].updated);
    if(!ids.length){box.innerHTML='<div style="padding:22px 12px;color:#999;font-size:12px">Nenhuma conversa.</div>';return}
    box.innerHTML=ids.map(id=>{
      const c=state.chats[id];
      return `<div class="chat-row ${id===activeChatId?'active':''}" data-chat-id="${id}">
        <div class="chat-title" onclick="window.K.openChat('${id}')">${esc(c.title)}</div>
        <div class="row-actions">
          <button class="row-action" title="Renomear" onclick="event.stopPropagation();window.K.renameChat('${id}')">✎</button>
          <button class="row-action" title="Apagar" onclick="event.stopPropagation();window.K.deleteChat('${id}')">×</button>
        </div>
      </div>`;
    }).join('');
  }

  function renderChat(){
    if(!state.chats[activeChatId]){createChat();return}
    const chat=state.chats[activeChatId];
    $('main').innerHTML=`
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-toggle" title="Abrir histórico" onclick="window.K.toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="topbar-title">${esc(chat.title)}</div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn desktop-only" title="Artefatos" onclick="window.K.setView('artifacts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 16h8M8 12h8M8 8h5"/></svg></button>
        </div>
      </header>
      <section class="messages" id="messages"></section>
      <section class="composer-wrap"><div class="composer">
        <div class="composer-box">
          <div class="attach-strip" id="attachStrip"></div>
          <div class="attach-menu" id="attachMenu">
            <button class="attach-option" onclick="window.K.pick('camera')"><span class="attach-option-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><span><span class="attach-option-title">Câmera</span><span class="attach-option-sub">Tirar uma foto</span></span></button>
            <button class="attach-option" onclick="window.K.pick('image')"><span class="attach-option-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span><span><span class="attach-option-title">Fotos</span><span class="attach-option-sub">Escolher da galeria</span></span></button>
            <button class="attach-option" onclick="window.K.pick('file')"><span class="attach-option-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></span><span><span class="attach-option-title">Arquivos</span><span class="attach-option-sub">PDF, DOC, TXT e mais</span></span></button>
          </div>
          <div class="composer-row">
            <button class="plus" id="plusBtn" onclick="window.K.toggleAttach()" title="Adicionar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
            <textarea id="prompt" rows="1" placeholder="Envie uma mensagem para o Klipza.IA"></textarea>
            <button class="send" id="sendBtn" disabled onclick="window.K.send()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
          </div>
        </div>
        <div class="composer-note">Klipza.IA pode cometer erros. Verifique informações importantes.</div>
      </div></section>`;
    bindComposer(); renderMessages();
  }
  function bindComposer(){
    const input=$('prompt'), send=$('sendBtn');
    input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(180,input.scrollHeight)+'px';send.disabled=!input.value.trim()});
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!send.disabled)window.K.send()}});
  }
  function renderMessages(){
    const chat=state.chats[activeChatId], box=$('messages');
    if(!chat.messages.length){
      box.innerHTML=`<div class="welcome"><div class="welcome-inner"><div class="welcome-mark">K</div><h1>Como posso ajudar?</h1><p>Converse, crie e trabalhe com seus arquivos.</p><div class="suggestions">
      <button class="suggestion" onclick="window.K.useSuggestion(this.dataset.t)" data-t="Crie uma ideia de projeto para meu fim de semana"><strong>Ideias</strong><span>Crie uma ideia de projeto para meu fim de semana</span></button>
      <button class="suggestion" onclick="window.K.useSuggestion(this.dataset.t)" data-t="Explique um assunto difícil de forma simples"><strong>Explique</strong><span>Explique um assunto difícil de forma simples</span></button>
      <button class="suggestion" onclick="window.K.useSuggestion(this.dataset.t)" data-t="Escreva um texto profissional curto"><strong>Escreva</strong><span>Escreva um texto profissional curto</span></button>
      <button class="suggestion" onclick="window.K.useSuggestion(this.dataset.t)" data-t="Analise este problema e me dê opções"><strong>Analise</strong><span>Analise este problema e me dê opções</span></button>
      </div></div></div>`; return;
    }
    const wrap=document.createElement('div');wrap.className='msg-width';
    chat.messages.forEach(m=>{
      const row=document.createElement('div');row.className='msg '+m.role;
      row.innerHTML=`<div class="msg-avatar">${m.role==='user'?esc(initials(state.user.name)):'K'}</div><div class="msg-content"><div class="msg-label">${m.role==='user'?'Você':'Klipza'}</div>${formatMessage(m.content)}</div>`;
      wrap.appendChild(row);
    }); box.innerHTML='';box.appendChild(wrap);box.scrollTop=box.scrollHeight;
  }
  function formatMessage(text){
    let s=esc(text);
    s=s.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>');
    s=s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.split(/\n\n+/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
    return s;
  }
  function useSuggestion(t){$('prompt').value=t;$('prompt').dispatchEvent(new Event('input'));$('prompt').focus()}

  function send(){
    ensureQuota();
    const input=$('prompt'); const text=input.value.trim(); if(!text)return;
    if(state.quota.energy<MSG_COST){render(); refreshQuotaUI(); alert('Sua energia diária acabou. Ela será recarregada em 24 horas.'); return;}
    state.quota.energy-=MSG_COST;
    const chat=state.chats[activeChatId];
    const content = attached.length ? text+'\n\nAnexos: '+attached.map(a=>a.name).join(', ') : text;
    chat.messages.push({role:'user',content});
    if(chat.title==='Nova conversa'){chat.title=text.slice(0,48)+(text.length>48?'…':'')}
    chat.updated=Date.now(); attached=[]; save(); renderHistory(); renderMessages();
    input.value='';input.style.height='37px';$('sendBtn').disabled=true;
    fakeReply(text);
  }
  function fakeReply(prompt){
    const chat=state.chats[activeChatId];
    setTimeout(()=>{
      const reply='Entendi. Esta é a interface do Klipza.IA funcionando localmente. Para respostas de IA reais, conecte o campo de envio a uma API/backend.\n\nVocê enviou: **'+prompt+'**';
      chat.messages.push({role:'ai',content:reply}); chat.updated=Date.now(); save(); renderMessages(); renderHistory();
    },450);
  }

  function toggleAttach(){
    const menu=$('attachMenu'), btn=$('plusBtn'); menu.classList.toggle('open');btn.classList.toggle('active');
  }
  function closeAttach(){if($('attachMenu')){$('attachMenu').classList.remove('open');$('plusBtn').classList.remove('active')}}
  function pick(kind){
    ensureQuota();
    if(state.quota.attachUsed>=ATTACH_LIMIT){ alert('Você já usou os 3 anexos deste ciclo.'); return; }
    closeAttach();
    const input=kind==='camera'?$('cameraInput'):kind==='image'?$('imageInput'):$('fileInput');
    input.value='';
    input.multiple = kind!=='camera';
    input.onchange=()=>{
      const files=[...input.files];
      const available=ATTACH_LIMIT-state.quota.attachUsed;
      const chosen=files.slice(0,available);
      if(!chosen.length)return;
      chosen.forEach(file=>attached.push({name:file.name,type:file.type||'file'}));
      state.quota.attachUsed+=chosen.length;
      save(); renderAttached(); refreshQuotaUI();
      if(files.length>available) alert(`Você pode adicionar mais ${available} anexo(s) neste ciclo.`);
    };
    input.click();
  }

  function renderAttached(){
    const strip=$('attachStrip'); if(!attached.length){strip.classList.remove('open');strip.innerHTML='';return}
    strip.classList.add('open');strip.innerHTML=attached.map((f,i)=>`<span class="attach-chip">${esc(f.name)} <button onclick="window.K.removeAttach(${i})">×</button></span>`).join('');
  }
  function removeAttach(i){attached.splice(i,1);renderAttached()}

  function renderArtifactsCount(){$('artifactCount').textContent=Object.keys(state.artifacts).length}
  function renderArtifactsPage(){
    const items=Object.values(state.artifacts).sort((a,b)=>b.created-a.created);
    $('main').innerHTML=`<header class="topbar"><div class="topbar-left"><button class="icon-btn" onclick="window.K.toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="topbar-title">Artefatos</div></div></header>
      <section class="artifacts-view"><div class="artifacts-inner"><h1 class="page-title">Artefatos</h1><div class="page-sub">Tudo que o Klipza.IA gerar pode ficar reunido aqui.</div>
      ${items.length?`<div class="artifact-grid">${items.map(a=>`<article class="artifact-card"><div class="artifact-head"><div class="artifact-icon">${a.type==='code'?'{}':a.type==='image'?'IMG':'TXT'}</div><div style="min-width:0"><div class="artifact-name">${esc(a.name)}</div><div class="artifact-meta">${esc(a.type)} · ${new Date(a.created).toLocaleDateString('pt-BR')}</div></div></div><div class="artifact-preview">${esc(a.preview||'Artefato gerado pelo Klipza.IA.')}</div></article>`).join('')}</div>`:'<div class="empty-page">Nenhum artefato ainda.</div>'}</div></section>`;
  }

  function renderSettingsPage(){
    const ini=initials(state.user?.name||'K');
    $('main').innerHTML=`<header class="topbar"><div class="topbar-left"><button class="icon-btn" onclick="window.K.toggleSidebar()" title="Abrir histórico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="topbar-title">Configurações</div></div></header>
      <section class="settings-view"><div class="settings-inner">
        <div class="settings-top">
          <div class="settings-top-main"><div class="settings-avatar">${esc(ini)}</div><div class="settings-head"><div class="settings-title">Configurações</div><div class="settings-subtitle">${esc(state.user.name)} · ${esc(state.user.email)}</div></div></div>
          <button class="settings-back" onclick="window.K.setView('chat')">Voltar ao chat</button>
        </div>
        <nav class="settings-nav">
          <a class="active" href="#conta">Conta</a><a href="#dados">Dados</a><a href="#energia">Energia</a><a href="#aparencia">Aparência</a><a href="#sessao">Sessão</a>
        </nav>
        <div class="settings-sections">
          <section class="settings-card" id="conta"><div class="settings-card-header"><div class="settings-card-title">Conta</div><div class="settings-card-desc">Informações da conta conectada ao Klipza.IA.</div></div><div class="settings-rows">
            <div class="settings-row"><div class="settings-copy"><div class="settings-name">Nome</div><div class="settings-detail">Nome usado no seu perfil.</div></div><div class="settings-control"><div class="settings-value">${esc(state.user.name)}</div></div></div>
            <div class="settings-row"><div class="settings-copy"><div class="settings-name">E-mail</div><div class="settings-detail">Conta usada para entrar no Klipza.IA.</div></div><div class="settings-control"><div class="settings-value">${esc(state.user.email)}</div></div></div>
            <div class="settings-row"><div class="settings-copy"><div class="settings-name">Acesso</div><div class="settings-detail">Sua conta está conectada pelo Google.</div></div><div class="settings-control"><span class="settings-value">Google conectado</span></div></div>
          </div></section>

          <section class="settings-card" id="dados"><div class="settings-card-header"><div class="settings-card-title">Dados</div><div class="settings-card-desc">Gerencie o conteúdo armazenado neste navegador.</div></div><div class="settings-rows">
            <div class="settings-row"><div class="settings-copy"><div class="settings-name">Conversas</div><div class="settings-detail">${Object.keys(state.chats).length} conversa(s) salva(s).</div></div><div class="settings-control"><button class="settings-action danger" onclick="window.K.clearHistory()">Apagar histórico</button></div></div>
            <div class="settings-row"><div class="settings-copy"><div class="settings-name">Artefatos</div><div class="settings-detail">${Object.keys(state.artifacts).length} artefato(s) salvo(s).</div></div><div class="settings-control"><button class="settings-action" onclick="window.K.setView('artifacts')">Abrir artefatos</button></div></div>
          </div></section>

          <section class="settings-card full" id="energia"><div class="settings-card-header"><div class="settings-card-title">Energia e anexos</div><div class="settings-card-desc">Os limites são renovados automaticamente a cada ciclo de 24 horas.</div></div><div class="settings-energy">
            <div class="settings-meter"><div class="settings-meter-top"><div><div class="settings-meter-name">Energia</div><div class="settings-meter-desc">100 pontos por ciclo · ${MSG_COST} pontos por mensagem.</div></div><div class="settings-meter-value">${state.quota.energy}</div></div><div class="settings-track"><span style="width:${energyPercent()}%"></span></div><div class="settings-meter-foot"><span>Restante</span><span>Recarrega em ${timeLeft(state.quota.resetAt-Date.now())}</span></div></div>
            <div class="settings-meter"><div class="settings-meter-top"><div><div class="settings-meter-name">Anexos</div><div class="settings-meter-desc">Câmera, fotos e arquivos.</div></div><div class="settings-meter-value">${ATTACH_LIMIT-state.quota.attachUsed}</div></div><div class="settings-track"><span style="width:${((ATTACH_LIMIT-state.quota.attachUsed)/ATTACH_LIMIT)*100}%"></span></div><div class="settings-meter-foot"><span>Disponíveis</span><span>Limite: ${ATTACH_LIMIT}</span></div></div>
          </div></section>

          <section class="settings-card" id="aparencia"><div class="settings-card-header"><div class="settings-card-title">Aparência</div><div class="settings-card-desc">Escolha o visual do Klipza.IA neste dispositivo.</div></div><div class="settings-themes">
            <button class="theme-card ${state.theme==='light'?'active':''}" onclick="window.K.setTheme('light')"><div class="theme-swatch light">Klipza.IA</div><div class="theme-name">Claro</div><div class="theme-desc">Interface clara, limpa e neutra.</div></button>
            <button class="theme-card ${state.theme==='dark'?'active':''}" onclick="window.K.setTheme('dark')"><div class="theme-swatch dark">Klipza.IA</div><div class="theme-name">Preto</div><div class="theme-desc">Interface escura para ambientes com pouca luz.</div></button>
          </div></section>

          <section class="settings-card" id="sessao"><div class="settings-card-header"><div class="settings-card-title">Sessão</div><div class="settings-card-desc">Ações da conta neste dispositivo.</div></div><div class="settings-rows">
            <div class="settings-row"><div class="settings-copy"><div class="settings-name">Sair</div><div class="settings-detail">Voltar para a tela de entrada e encerrar a sessão atual.</div></div><div class="settings-control"><button class="settings-action" onclick="window.K.logout()">Sair da conta</button></div></div>
          </div></section>
        </div>
        <div class="settings-foot">Klipza.IA · Configurações</div>
      </div></section>`;
    refreshQuotaUI();
    const links=[...document.querySelectorAll('.settings-nav a')];
    const cards=links.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);
    links.forEach(a=>a.addEventListener('click',()=>{links.forEach(x=>x.classList.remove('active'));a.classList.add('active')}));
    if('IntersectionObserver' in window){
      const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id));}})},{root:document.querySelector('.settings-view'),rootMargin:'-90px 0px -55% 0px',threshold:.01});
      cards.forEach(card=>obs.observe(card));
    }
  }

  window.K={loginDemo,enter,logout,toggleSidebar,setView,createChat,openChat,deleteChat,renameChat,clearHistory,useSuggestion,send,toggleAttach,pick,removeAttach,renderAttached,setTheme};
  $('googleBtn').addEventListener('click',loginDemo);$('accountBtn').addEventListener('click',()=>setView('settings'));$('closeSidebar').addEventListener('click',toggleSidebar);$('headNew').addEventListener('click',createChat);$('newChatBtn').addEventListener('click',createChat);$('logoutBtn').addEventListener('click',logout);
  document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  setInterval(()=>{ if(state.user){ ensureQuota(); refreshQuotaUI(); } }, 30000);
  applyTheme();
  if(state.user) enter();
})();
</script>
</body>
</html>
