<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Klipza.IA</title>
<style>
:root{
  --bg:#fff;--panel:#fafafa;--panel2:#f4f4f4;--line:#e5e5e5;--line2:#d8d8d8;
  --text:#111;--muted:#747474;--black:#000;--hover:#f0f0f0;--radius:14px;
  --sidebar:300px;--content:820px;--danger:#b00020;
}
body.dark{
  --bg:#0b0b0b;--panel:#111;--panel2:#171717;--line:#262626;--line2:#333;
  --text:#f3f3f3;--muted:#9a9a9a;--black:#fff;--hover:#1b1b1b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer}
svg{display:block}
.hidden{display:none!important}
#app.settings-mode{grid-template-columns:0 minmax(0,1fr)}
#app.settings-mode>.sidebar{transform:translateX(-100%);opacity:0;pointer-events:none}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:24px}
.login-card{width:min(390px,100%);text-align:center}
.login-brand{font-size:34px;line-height:1;font-weight:700;letter-spacing:-1.8px;margin-bottom:12px}
.login-brand span{font-weight:400}
.login-copy{font-size:14px;color:var(--muted);margin-bottom:28px}
.google-btn{width:100%;height:50px;border:1px solid var(--black);border-radius:11px;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;gap:11px;font-size:14px;font-weight:600;transition:.16s}
.google-btn:hover{background:#000;color:#fff}
.google-btn:active{transform:translateY(1px)}
.google-icon{width:18px;height:18px}
.login-note{font-size:11px;line-height:1.6;color:var(--muted);margin-top:18px}

/* APP */
#app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);height:100dvh;width:100%;transition:grid-template-columns .2s ease}
#app.sidebar-collapsed{grid-template-columns:0 minmax(0,1fr)}
.sidebar{height:100dvh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:transform .22s ease,opacity .18s ease}
#app.sidebar-collapsed .sidebar{transform:translateX(-100%);opacity:0;pointer-events:none}
.side-head{height:58px;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-size:17px;font-weight:700;letter-spacing:-.5px;flex:1}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:17px;height:17px}
.new-chat{margin:12px;height:42px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600}
.new-chat:hover{border-color:#000;background:#000;color:#fff}
.nav{padding:4px 9px 8px}
.nav-btn{width:100%;height:40px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:10px;text-align:left;font-size:13px;color:#444}
.nav-btn:hover{background:var(--hover);color:#000}
.nav-btn.active{background:#000;color:#fff}
.nav-btn svg{width:16px;height:16px;flex:0 0 auto}
.nav-label{flex:1}
.nav-count{font-size:10px;opacity:.65}
.history-head{padding:12px 14px 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#999;font-weight:700}
.history{flex:1;overflow:auto;padding:2px 9px 10px}
.chat-row{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 7px 0 10px;border-radius:9px;color:#333;margin:2px 0}
.chat-row:hover{background:var(--hover)}
.chat-row.active{background:#e9e9e9;color:#000}
.chat-title{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.row-actions{display:none;align-items:center;gap:1px}
.chat-row:hover .row-actions,.chat-row.active .row-actions{display:flex}
.row-action{width:27px;height:27px;border-radius:7px;display:grid;place-items:center}
.row-action:hover{background:#fff}
.rename-input{min-width:0;width:100%;height:28px;border:1px solid #000;border-radius:7px;background:#fff;padding:0 7px;font-size:13px}
.account{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;}
.account:focus-visible{outline:2px solid #000;outline-offset:2px;}
.side-bottom{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.account{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px}
.account:hover{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.account-copy{min-width:0;flex:1}
.account-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-email{font-size:10px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* MAIN */
.main{height:100dvh;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 clamp(14px,2vw,28px);flex:0 0 auto}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.topbar-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-sub{font-size:11px;color:#999}
.topbar-right{display:flex;gap:5px;align-items:center}

.messages{flex:1;overflow:auto;padding:clamp(22px,3vw,38px) 0 18px;scroll-behavior:smooth}
.msg-width{width:min(var(--content),calc(100% - 38px));margin:0 auto}
.msg{display:flex;gap:12px;margin:0 0 30px}
.msg:last-child{margin-bottom:4px}
.msg-avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:11px;font-weight:700;margin-top:2px}
.msg.user .msg-avatar{background:#000;color:#fff}
.msg.ai .msg-avatar{border:1px solid #000;background:#fff}
.msg-content{min-width:0;flex:1;font-size:15px;line-height:1.7}
.msg-label{font-size:11px;font-weight:700;margin-bottom:4px;color:#777}
.msg-content p{margin-bottom:10px}.msg-content p:last-child{margin-bottom:0}
.msg-content pre{background:#f6f6f6;border:1px solid #dedede;border-radius:10px;padding:13px;overflow:auto;margin:10px 0;font-size:12px;line-height:1.55}
.msg-content code{background:#f0f0f0;padding:2px 5px;border-radius:5px;font-size:.9em}
.msg-content ul{padding-left:20px;margin:8px 0}
.msg-attachments{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.msg-attachment-image{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);max-width:280px}
.msg-attachment-image img{display:block;width:100%;height:auto;max-height:280px;object-fit:cover}
.msg-attachment-file{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);font-size:12px;min-width:180px}
.msg-attachment-file .file-icon{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700}

.welcome{min-height:100%;display:grid;place-items:center;padding:35px 18px}
.welcome-inner{width:min(690px,100%);text-align:center}
.welcome-mark{width:54px;height:54px;border:1px solid #111;border-radius:16px;margin:0 auto 18px;display:grid;place-items:center;font-size:20px;font-weight:700}
.welcome h1{font-size:28px;letter-spacing:-.9px;margin-bottom:8px}
.welcome p{font-size:13px;color:#777;margin-bottom:24px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.suggestion{min-height:72px;border:1px solid var(--line);border-radius:12px;text-align:left;padding:13px;background:var(--bg);transition:.15s}
.suggestion:hover{border-color:#000;background:#fafafa}
.suggestion strong{display:block;font-size:12px;margin-bottom:4px}
.suggestion span{font-size:11px;line-height:1.5;color:#777}

.composer-wrap{padding:12px 16px 16px;flex:0 0 auto}
.composer{width:min(var(--content),100%);margin:0 auto}
.composer-box{position:relative;z-index:6;border:1px solid var(--black);border-radius:16px;background:var(--bg);box-shadow:0 2px 16px rgba(0,0,0,.05)}
.attach-strip{display:none;padding:10px 11px;border-bottom:1px solid var(--line);gap:7px;flex-wrap:wrap}
.attach-strip.open{display:flex}
.attach-chip{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;background:#f0f0f0;font-size:11px}
.attach-chip.attach-preview{padding:4px 7px 4px 4px}.attach-preview img{width:28px;height:28px;object-fit:cover;border-radius:6px}.attach-preview span{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-chip button{font-size:15px;color:#666}
.attach-menu{position:absolute;left:7px;bottom:58px;width:min(320px,calc(100vw - 24px));display:none;flex-direction:column;gap:2px;padding:7px;background:var(--panel);border:1px solid var(--line2);border-radius:17px;box-shadow:0 20px 55px rgba(0,0,0,.18);z-index:50;max-height:min(420px,64vh);overflow:auto}
.attach-menu.open{display:flex;animation:menuUp .15s cubic-bezier(.2,.8,.2,1)}
@keyframes menuUp{from{opacity:0;transform:translateY(10px) scale(.97);transform-origin:bottom left}to{opacity:1;transform:translateY(0) scale(1);transform-origin:bottom left}}
.attach-menu::after{content:"";position:absolute;left:18px;bottom:-6px;width:11px;height:11px;background:var(--panel);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:rotate(45deg)}
.attach-option{width:100%;flex:0 0 auto;border:0;border-radius:11px;padding:9px 10px;display:flex;align-items:center;gap:11px;text-align:left;background:transparent;color:var(--text);min-height:50px}
.attach-option:hover{background:var(--hover)}
.attach-option:active{background:var(--line)}
.attach-option.upcoming{position:relative;cursor:pointer}
.attach-option.upcoming:hover{background:var(--hover)}
.attach-option.upcoming .attach-option-icon{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.soon-badge{margin-left:auto;font-size:8px;padding:3px 6px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);white-space:nowrap;background:var(--panel2)}
.attach-option-icon{width:32px;height:32px;border-radius:9px;background:var(--black);color:var(--bg);display:grid;place-items:center;flex:0 0 auto}
.attach-option-icon svg{width:15px;height:15px}
.attach-option-title{display:block;font-size:12px;font-weight:650;line-height:1.2}.attach-option-sub{display:block;font-size:10px;color:var(--muted);margin-top:2px;line-height:1.25}
.attach-divider{height:1px;background:var(--line);margin:4px 6px}
.attach-section-label{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 9px 5px}
@media(max-width:720px){.attach-menu{left:6px;bottom:60px;width:min(325px,calc(100vw - 18px));max-height:60vh;border-radius:16px}.attach-option{min-height:50px;padding:9px}.attach-option-icon{width:31px;height:31px}}
@media(max-width:720px){.energy-banner{align-items:flex-start;margin:0 0 9px;width:100%;padding:10px}.energy-banner-copy{flex:1}.energy-prime{height:32px;padding:0 10px;font-size:10px}}
.composer-row{display:flex;align-items:flex-end;gap:7px;padding:7px}
.plus{width:37px;height:37px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;border:1px solid transparent;transition:.15s}.plus:hover{background:var(--hover);border-color:var(--line)}
.plus.active{background:#000;color:#fff;border-color:#000;transform:rotate(45deg)}
.plus svg{width:18px;height:18px}
textarea#prompt{flex:1;resize:none;border:0;outline:0;background:transparent;padding:8px 6px;min-height:37px;max-height:180px;font-size:14px;line-height:1.5}
.send{width:37px;height:37px;border-radius:10px;background:#000;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.send:disabled{background:#ccc;cursor:not-allowed}
.composer-note{text-align:center;font-size:10px;color:#aaa;margin-top:7px}

/* ARTIFACTS */
.artifacts-view{height:100%;overflow:auto;padding:32px 20px 60px}
.artifacts-inner{width:min(880px,100%);margin:0 auto}
.page-title{font-size:26px;letter-spacing:-.7px;margin-bottom:4px}.page-sub{font-size:13px;color:#777;margin-bottom:24px}
.artifact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.artifact-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);min-height:150px;display:flex;flex-direction:column;gap:11px;cursor:pointer}
.artifact-card:hover{border-color:#000}
.artifact-head{display:flex;align-items:center;gap:9px}.artifact-icon{width:34px;height:34px;background:#000;color:#fff;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700}.artifact-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artifact-meta{font-size:10px;color:#999;margin-top:2px}.artifact-preview{font-size:11px;color:#666;line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.empty-page{padding:60px 10px;text-align:center;color:#999;font-size:13px;border:1px dashed #ddd;border-radius:14px}

/* SETTINGS — REDESIGN */
.settings-view{height:100%;overflow:auto;background:var(--bg);padding:28px 30px 60px}
.settings-inner{width:min(1180px,100%);margin:0 auto}
.settings-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 20px}
.settings-top-main{display:flex;align-items:center;gap:14px;min-width:0}
.settings-avatar{width:48px;height:48px;border-radius:14px;background:var(--black);color:var(--bg);display:grid;place-items:center;font-size:15px;font-weight:800;flex:0 0 auto}
.settings-head{min-width:0}.settings-title{font-size:24px;font-weight:700;letter-spacing:-.6px}.settings-subtitle{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings-back{padding:9px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);font-size:11px;font-weight:700;white-space:nowrap}.settings-back:hover{background:var(--black);color:var(--bg);border-color:var(--black)}
.settings-nav{display:flex;align-items:center;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:auto;scrollbar-width:none;position:sticky;top:0;z-index:3}.settings-nav::-webkit-scrollbar{display:none}
.settings-nav a{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:8px;color:var(--muted);font-size:11px;font-weight:650;text-decoration:none;white-space:nowrap;transition:.15s}.settings-nav a:hover{background:var(--hover);color:var(--text)}.settings-nav a.active{background:var(--black);color:var(--bg)}
.settings-sections{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:14px;align-items:start}
.settings-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;scroll-margin-top:74px}
.settings-card.full{grid-column:1 / -1}.settings-card-header{padding:17px 18px 12px;border-bottom:1px solid var(--line)}
.settings-card-title{font-size:13px;font-weight:750}.settings-card-desc{font-size:11px;line-height:1.5;color:var(--muted);margin-top:4px}
.settings-rows{padding:0 18px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:64px;padding:13px 0;border-top:1px solid var(--line)}.settings-row:first-child{border-top:0}
.settings-copy{min-width:0}.settings-name{font-size:12px;font-weight:650}.settings-detail{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px;overflow-wrap:anywhere}
.settings-control{flex:0 0 auto;display:flex;align-items:center;gap:8px}.settings-value{font-size:11px;font-weight:600;color:var(--muted);text-align:right;max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-action{padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);font-size:11px;font-weight:650;white-space:nowrap}.settings-action:hover{background:var(--black);color:var(--bg);border-color:var(--black)}
.settings-action.danger{border-color:var(--black)}
.settings-energy{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-meter{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}.settings-meter-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.settings-meter-name{font-size:12px;font-weight:700}.settings-meter-desc{font-size:10px;color:var(--muted);line-height:1.45;margin-top:3px}.settings-meter-value{font-size:19px;font-weight:750;white-space:nowrap}.settings-track{height:7px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:12px}.settings-track span{display:block;height:100%;background:var(--black);border-radius:999px;transition:width .25s}.settings-meter-foot{font-size:10px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.settings-themes{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.theme-card{border:1px solid var(--line);border-radius:13px;background:var(--bg);padding:10px;text-align:left;transition:.15s}.theme-card:hover{border-color:var(--black)}.theme-card.active{border:2px solid var(--black);padding:9px}.theme-swatch{height:92px;border-radius:9px;display:flex;align-items:flex-end;padding:12px;font-size:14px;font-weight:700;letter-spacing:-.2px}.theme-swatch.light{background:#fff;color:#111;border:1px solid #eee}.theme-swatch.dark{background:#0b0b0b;color:#fff;border:1px solid #222}.theme-name{font-size:12px;font-weight:700;margin-top:10px}.theme-desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.settings-foot{font-size:10px;color:var(--muted);text-align:center;padding:18px 0 6px}
@media(max-width:980px){.settings-sections{grid-template-columns:1fr}.settings-card.full{grid-column:auto}.settings-energy{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.settings-view{padding:16px 12px 42px}.settings-top{padding:8px 0 14px;align-items:flex-start}.settings-title{font-size:21px}.settings-subtitle{white-space:normal}.settings-back{padding:8px 10px}.settings-nav{margin-bottom:12px}.settings-nav a{padding:9px 12px;font-size:10px}.settings-sections{gap:10px}.settings-card{border-radius:13px}.settings-card-header{padding:15px}.settings-rows{padding:0 15px}.settings-row{align-items:flex-start;flex-direction:column;gap:10px;padding:14px 0}.settings-control{width:100%;justify-content:flex-start}.settings-value{max-width:none;text-align:left;white-space:normal}.settings-action{width:auto}.settings-energy,.settings-themes{padding:12px 15px;grid-template-columns:1fr}.theme-swatch{height:78px}.settings-avatar{width:44px;height:44px;border-radius:12px;font-size:14px}}

/* MOBILE */
.mobile-close{display:none}
@media (max-width:900px){
  :root{--sidebar:280px}
  .artifact-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  #app{grid-template-columns:1fr}
  body{overflow:hidden}
  .sidebar{position:fixed;z-index:100;left:0;top:0;bottom:0;width:min(88vw,300px);height:100dvh;box-shadow:14px 0 30px rgba(0,0,0,.18);will-change:transform}
  #app.sidebar-collapsed{grid-template-columns:1fr}
  #app.sidebar-collapsed .sidebar{transform:translateX(-104%);opacity:1;pointer-events:none}
  .main{width:100vw;min-width:0;position:relative;z-index:1}
  .topbar{position:relative;z-index:5;padding:0 12px;height:54px}.topbar-right .desktop-only{display:none}
  .messages{padding-top:20px;padding-bottom:18px;min-height:0}.msg-width{width:calc(100% - 24px)}
  .msg{gap:9px;margin-bottom:24px}.msg-content{font-size:14px}.msg-avatar{width:27px;height:27px}
  .welcome{padding:28px 14px}.welcome h1{font-size:24px}.suggestions{grid-template-columns:1fr}
  .composer-wrap{position:relative;z-index:4;padding:10px 9px max(12px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  .composer-box{z-index:6}
  .composer-note{font-size:9px}
  .attach-option{flex-basis:100%}.artifact-grid{grid-template-columns:1fr}.artifacts-view,.settings-view{padding:24px 14px 50px}
  #app:not(.sidebar-collapsed)::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:90;pointer-events:auto}
}
@media (min-width:721px){#app.sidebar-collapsed .topbar .menu-toggle{display:grid}}

/* NO MODALS: all views are inside the main area */

/* ENERGY SYSTEM */
.energy-card{margin:12px 14px 10px;padding:13px;border:1px solid #e7e7e7;border-radius:14px;background:#fff;transition:opacity .2s,transform .2s}
.energy-card.energy-empty{border-color:#111;box-shadow:0 8px 22px rgba(0,0,0,.05)}
.energy-card.energy-empty .energy-meta{color:#111;font-weight:700}

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'klipza_pro_v1';
  let state = loadState();
  state.theme = state.theme || 'light';
  state.settings = state.settings || {notifications:false,sounds:false};
  const ENERGY_MAX=100, MSG_COST=2, ATTACH_LIMIT=3, CYCLE_MS=24*60*60*1000;
  let currentView = 'chat';
  let activeChatId = state.activeChatId || null;
  let attached = [];

  function loadState(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {user:null,chats:{},artifacts:{},activeChatId:null,quota:null,theme:'light',settings:{notifications:false,sounds:false}};
  }

  function ensureQuota(){
    state.quota=state.quota||{energy:ENERGY_MAX,attachUsed:0,resetAt:Date.now()+CYCLE_MS};
    const now=Date.now();
    if(!state.quota.resetAt || now>=state.quota.resetAt){
      state.quota={energy:ENERGY_MAX,attachUsed:0,resetAt:now+CYCLE_MS};
      save();
    }
  }
  function timeLeft(ms){
    const total=Math.max(0,Math.floor(ms/1000));
    const h=Math.floor(total/3600), m=Math.floor((total%3600)/60);
    if(h>=1) return `${h}h ${String(m).padStart(2,'0')}min`;
    return `${m}min`;
  }
  function energyPercent(){ensureQuota(); return Math.max(0,Math.min(100,state.quota.energy));}
  function quotaHTML(compact=false){
    ensureQuota();
    const pct=energyPercent();
    const attachPct=Math.max(0,Math.min(100,((ATTACH_LIMIT-state.quota.attachUsed)/ATTACH_LIMIT)*100));
    const empty=state.quota.energy<MSG_COST;
    return `<div class="energy-card ${empty?'energy-empty':''}">
      <div class="energy-head"><div class="energy-title">Energia</div><div class="energy-value">${state.quota.energy}</div></div>
      <div class="energy-row"><div class="energy-ring" style="--pct:${pct}%"><span>${pct}</span></div><div class="energy-copy"><div class="energy-label">${empty?'Ciclo esgotado':'Uso diário'}</div><div class="energy-meta">${empty?'Mude para Klipza.Prime ou aguarde a recarga':'Pronta para a próxima mensagem'}</div></div></div>
      <div class="energy-bar"><span style="width:${pct}%"></span></div>
      <div class="energy-foot"><span>Recarrega em ${timeLeft(state.quota.resetAt-Date.now())}</span><span>${state.quota.attachUsed}/${ATTACH_LIMIT} anexos</span></div>
    </div>`;

  function updateEnergyBanner(){

  function paintEnergyValue(value){
    const pct=Math.max(0,Math.min(100,value));
    const bar=document.querySelector('#sideQuota .energy-bar span');

    const ringText=document.querySelector('#sideQuota .energy-ring span');
    const valueText=document.querySelector('#sideQuota .energy-value');
    if(bar)bar.style.width=pct+'%';
    if(ring)ring.style.background=`conic-gradient(#000 ${pct}%,#ededed 0)`;
    if(ringText)ringText.textContent=Math.round(pct);
    if(valueText)valueText.textContent=Math.round(pct);

  function animateEnergyChange(from,to){
    const start=Math.max(0,Math.min(100,from)), target=Math.max(0,Math.min(100,to)), t0=performance.now(), dur=1150;
    function frame(now){
      const p=Math.min(1,(now-t0)/dur), eased=1-Math.pow(1-p,3);
      paintEnergyValue(start+(target-start)*eased);
      if(p<1)requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

    closeAttach();
    const input=kind==='camera'?$('cameraInput'):kind==='image'?$('imageInput'):$('fileInput');

      save(); renderAttached(); refreshQuotaUI();
      $('sendBtn').disabled=!$('prompt').value.trim()&&!attached.length;

  function readImagePreview(file){
    return new Promise(resolve=>{
      const r=new FileReader();
      r.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const max=900, scale=Math.min(1,max/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',0.82));
        };
        img.onerror=()=>resolve(r.result); img.src=r.result;
      };
      r.onerror=()=>resolve(null); r.readAsDataURL(file);
    });
  }

      ${items.length?`<div class="artifact-grid">${items.map(a=>`<article class="artifact-card"><div class="artifact-head"><div class="artifact-icon">${a.type==='code'?'{}':a.type==='image'?'IMG':'TXT'}</div><div style="min-width:0"><div class="artifact-name">${esc(a.name)}</div><div class="artifact-meta">${esc(a.type)} · ${new Date(a.created).toLocaleDateString('pt-BR')}</div></div></div><div class="artifact-preview">${esc(a.preview||'Artefato gerado pelo Klipza.IA.')}</div></article>`).join('')}</div>`:'<div class="empty-page">Nenhum artefato ainda.</div>'}</div></section>`;
  }

  function renderSettingsPage(){
    const ini=initials(state.user?.name||'K');
    const items=[
      ['geral','Geral','M0 0'],
      ['notificacoes','Notificações','M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4'],
      ['personalizacao','Personalização','M12 3v18M3 12h18'],
      ['plugins','Plugins','M7 3h10v18H7z'],
      ['voz','Voz','M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3M5 11a7 7 0 0 0 14 0M12 18v4'],
      ['faturamento','Faturamento','M4 7h16v10H4zM4 11h16'],
      ['dados','Controles de dados','M6 4h12v16H6zM9 8h6M9 12h6M9 16h4'],
      ['armazenamento','Armazenamento','M4 6h16v12H4zM8 10h8'],
      ['seguranca','Segurança','M12 3l7 4v5c0 4.5-3 7-7 9-4-2-7-4.5-7-9V7l7-4z'],
      ['login','Segurança e login','M7 11V8a5 5 0 0 1 10 0v3M5 11h14v9H5z'],
      ['parental','Controles parentais','M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M3 21a5 5 0 0 1 10 0'],
      ['contato','Contato confiável','M4 4h16v16H4zM8 12h8M12 8v8'],
      ['conta','Conta','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21a8 8 0 0 1 16 0'],
      ['teclado','Teclado','M3 6h18v12H3zM7 10h.01M11 10h.01M15 10h.01M19 10h.01M7 14h10']
    ];
    const active=window.__klipzaSettingsSection||'geral';
    function icon(path){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path==='M0 0'?'':''}<path d="${path}"/></svg>`}
    const menu=items.map(([id,label,path])=>`<button type="button" class="settings-item ${active===id?'active':''}" data-setting="${id}">${icon(path)}<span>${label}</span>${id!=='geral'&&id!=='conta'&&id!=='dados'&&id!=='armazenamento'&&id!=='seguranca'&&id!=='login'&&id!=='personalizacao'&&id!=='notificacoes'&&id!=='teclado'?'<span class="soon">Em breve</span>':''}</button>`).join('');
    const unavailable=(title,desc='Este recurso ainda não está disponível no Klipza.IA.')=>`
      <div class="settings-titlebar"><h1>${title}</h1></div>
      <div class="settings-panel">
        <div class="settings-group-title">${title}</div>
        <div class="settings-line">
          <div class="settings-line-copy"><div class="settings-line-name">Recurso ainda não disponível</div><div class="settings-line-desc">${desc}</div></div>
          <div class="settings-line-value"><span class="settings-badge">Em breve</span></div>
        </div>
        <div class="settings-line">
          <div class="settings-line-copy"><div class="settings-line-name">Status</div><div class="settings-line-desc">Quando este recurso estiver disponível, as opções aparecerão aqui, no painel à direita.</div></div>
          <div class="settings-line-value"><span class="settings-badge">Em desenvolvimento</span></div>
        </div>
      </div>`;
    let content='';
    if(active==='geral'){
      content=`
        <div class="settings-titlebar"><h1>Geral</h1></div>
        <div class="settings-panel">
          <div class="settings-group-title">Aparência</div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Aparência</div><div class="settings-line-desc">Escolha o tema da interface.</div></div><div class="settings-line-value"><button class="settings-badge" onclick="window.K.setTheme('${state.theme==='dark'?'light':'dark'}')">${state.theme==='dark'?'Preto':'Claro'} · trocar</button></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Contraste</div></div><div class="settings-line-value"><span class="muted">Em breve</span><span class="settings-chevron">⌄</span></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Cor de ênfase</div></div><div class="settings-line-value"><span class="settings-dot"></span><span class="muted">Padrão · em breve</span><span class="settings-chevron">⌄</span></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Cor do ícone</div></div><div class="settings-line-value"><span class="settings-dot dark"></span><span class="muted">Preto · em breve</span><span class="settings-chevron">⌄</span></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Idioma</div><div class="settings-line-desc">Idioma atual da interface.</div></div><div class="settings-line-value">Português (Brasil)<span class="settings-badge">Autodetectar em breve</span></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Inteligência avançada</div><div class="settings-line-desc">Recurso ainda em desenvolvimento.</div></div><div class="settings-line-value"><div class="settings-toggle"></div><span class="settings-badge">Em desenvolvimento</span></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Ativar ditado</div><div class="settings-line-desc">Entrada por voz ainda não disponível.</div></div><div class="settings-line-value"><div class="settings-toggle"></div><span class="settings-badge">Em breve</span></div></div>
        </div>`;
    } else if(active==='personalizacao'){
      content=`
        <div class="settings-titlebar"><h1>Personalização</h1></div>
        <div class="settings-panel">
          <div class="settings-group-title">Tema</div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Tema claro</div><div class="settings-line-desc">Interface clara do Klipza.IA.</div></div><div class="settings-line-value"><button class="settings-badge" onclick="window.K.setTheme('light')">${state.theme==='light'?'Ativo':'Usar'}</button></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Tema preto</div><div class="settings-line-desc">Interface escura em preto e branco.</div></div><div class="settings-line-value"><button class="settings-badge" onclick="window.K.setTheme('dark')">${state.theme==='dark'?'Ativo':'Usar'}</button></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Outras personalizações</div><div class="settings-line-desc">Cores, densidade e outros ajustes ainda estão em desenvolvimento.</div></div><div class="settings-line-value"><span class="settings-badge">Em breve</span></div></div>
        </div>`;
    } else if(active==='dados'){
      content=`
        <div class="settings-titlebar"><h1>Controles de dados</h1></div>
        <div class="settings-panel">
          <div class="settings-group-title">Seus dados neste navegador</div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Conversas</div><div class="settings-line-desc">${Object.keys(state.chats).length} conversa(s) salva(s) localmente.</div></div><div class="settings-line-value"><button class="settings-badge" onclick="window.K.clearHistory()">Apagar histórico</button></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Artefatos</div><div class="settings-line-desc">${Object.keys(state.artifacts).length} artefato(s) armazenado(s).</div></div><div class="settings-line-value"><button class="settings-badge" onclick="window.K.setView('artifacts')">Abrir artefatos</button></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Exportação de dados</div><div class="settings-line-desc">Ainda não disponível.</div></div><div class="settings-line-value"><span class="settings-badge">Em breve</span></div></div>
        </div>`;
    } else if(active==='armazenamento'){
      content=`
        <div class="settings-titlebar"><h1>Armazenamento</h1></div>
        <div class="settings-panel">
          <div class="settings-group-title">Uso local</div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Conversas</div><div class="settings-line-desc">Dados mantidos neste navegador.</div></div><div class="settings-line-value">${Object.keys(state.chats).length}</div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Artefatos</div><div class="settings-line-desc">Arquivos e resultados salvos localmente.</div></div><div class="settings-line-value">${Object.keys(state.artifacts).length}</div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Limpar todos os dados locais</div><div class="settings-line-desc">Remove conversas, artefatos, energia e preferências salvas neste navegador.</div></div><div class="settings-line-value"><button class="settings-badge danger" onclick="window.K.clearAllLocalData()">Limpar tudo</button></div></div>
        </div>`;
    } else if(active==='conta'){
      content=`
        <div class="settings-titlebar"><h1>Conta</h1></div>
        <div class="settings-panel">
          <div class="settings-account-card"><div class="settings-account-row"><div class="settings-account-avatar">${esc(ini)}</div><div class="settings-account-meta"><strong>${esc(state.user.name)}</strong><div>${esc(state.user.email)}</div></div></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Login</div><div class="settings-line-desc">A conta foi conectada usando Google.</div></div><div class="settings-line-value"><span class="settings-badge">Google conectado</span></div></div>
          <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Gerenciamento da conta</div><div class="settings-line-desc">Ferramentas de conta ainda estão em desenvolvimento.</div></div><div class="settings-line-value"><span class="settings-badge">Em breve</span></div></div>
        </div>`;
    } else if(active==='notificacoes'){
      content=`<div class="settings-titlebar"><h1>Notificações</h1></div><div class="settings-panel"><div class="settings-group-title">Preferências</div>
        <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Notificações do navegador</div><div class="settings-line-desc">Receba um aviso quando uma resposta do Klipza.IA terminar.</div></div><div class="settings-line-value"><button class="settings-badge" onclick="window.K.toggleNotifications()">${state.settings.notifications?'Ativas':'Ativar'}</button></div></div>
        <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Sons da interface</div><div class="settings-line-desc">Sons ainda são opcionais; o estado é salvo neste navegador.</div></div><div class="settings-line-value"><button class="settings-badge" onclick="window.K.toggleSounds()">${state.settings.sounds?'Ativos':'Desativados'}</button></div></div>
      </div>`;
    } else if(active==='teclado'){
      content=`<div class="settings-titlebar"><h1>Teclado</h1></div><div class="settings-panel"><div class="settings-group-title">Atalhos disponíveis</div>
        <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Enter</div><div class="settings-line-desc">Enviar mensagem.</div></div><div class="settings-line-value">Ativo</div></div>
        <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Shift + Enter</div><div class="settings-line-desc">Inserir uma nova linha.</div></div><div class="settings-line-value">Ativo</div></div>
        <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Atalhos personalizados</div><div class="settings-line-desc">Edição completa dos atalhos ainda está em desenvolvimento.</div></div><div class="settings-line-value"><span class="settings-badge">Em desenvolvimento</span></div></div>
      </div>`;
    } else if(active==='seguranca'||active==='login'){
      content=`<div class="settings-titlebar"><h1>${active==='seguranca'?'Segurança':'Segurança e login'}</h1></div><div class="settings-panel"><div class="settings-group-title">Proteção da conta</div>
        <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Login</div><div class="settings-line-desc">Sessão atual autenticada pelo fluxo Google demo.</div></div><div class="settings-line-value"><span class="settings-badge">Conectado</span></div></div>
        <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Encerrar sessão</div><div class="settings-line-desc">Sai da conta neste navegador.</div></div><div class="settings-line-value"><button class="settings-badge danger" onclick="window.K.logout()">Sair</button></div></div>
        <div class="settings-line"><div class="settings-line-copy"><div class="settings-line-name">Autenticação avançada</div><div class="settings-line-desc">2FA e gerenciamento avançado ainda estão em desenvolvimento.</div></div><div class="settings-line-value"><span class="settings-badge">Em desenvolvimento</span></div></div>
      </div>`;
    } else if(active==='plugins'){
      content=unavailable('Plugins','Integrações e plugins ainda estão em desenvolvimento. Nenhuma integração é ativada sem a sua confirmação.');
    } else if(active==='voz'){
      content=unavailable('Voz','Entrada e saída de voz ainda estão em desenvolvimento no Klipza.IA.');
    } else if(active==='faturamento'){
      content=unavailable('Faturamento','O sistema de planos e pagamentos ainda está em desenvolvimento.');
    } else if(active==='parental'){
      content=unavailable('Controles parentais','Controles parentais ainda estão em desenvolvimento e ainda não estão disponíveis.');
    } else if(active==='contato'){
      content=unavailable('Contato confiável','O recurso de contato confiável ainda está em desenvolvimento.');
    } else {
      content=unavailable('Configurações');
    }
    $('main').innerHTML=`<section class="settings-view ${window.__klipzaSettingsMobileDetail && window.innerWidth<=720 ? 'mobile-detail' : ''}">
      <div class="settings-workspace">
        <aside class="settings-sidebar">
          <div class="settings-sidebar-top"><button class="settings-close" onclick="window.K.setView('chat')" title="Fechar configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
          <div class="settings-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="settingsSearch" placeholder="Pesquisar configurações"></div>
          <nav class="settings-menu" id="settingsMenu">${menu}</nav>
        </aside>
        <div class="settings-main" id="settingsMain">
          <div class="settings-content" id="settingsContent">
            <button type="button" class="settings-mobile-back" onclick="window.K.settingsBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Configurações</button>
            ${content}
          </div>
        </div>
      </div>
    </section>`;
    const search=$('settingsSearch');
    if(search) search.addEventListener('input',()=>{
      const q=search.value.trim().toLowerCase();
      document.querySelectorAll('.settings-item').forEach(btn=>{btn.classList.toggle('settings-hidden',!!q&&!btn.textContent.toLowerCase().includes(q));});
    });
    const settingsMenu=$('settingsMenu');
    if(settingsMenu){
      settingsMenu.addEventListener('click',(ev)=>{
        const btn=ev.target.closest('.settings-item');
        if(!btn || !settingsMenu.contains(btn)) return;
        ev.preventDefault();
        window.__klipzaSettingsSection=btn.dataset.setting;
        window.__klipzaSettingsMobileDetail = window.innerWidth <= 720;
        renderSettingsPage();
      });
    }
    const settingsMain=$('settingsMain');
    if(settingsMain){settingsMain.scrollTop=0;}
  }

  function settingsBack(){
    window.__klipzaSettingsMobileDetail=false;
    renderSettingsPage();
  }
  window.K={loginDemo,enter,logout,toggleSidebar,setView,createChat,openChat,deleteChat,renameChat,clearHistory,useSuggestion,send,toggleAttach,pick,
    upcoming,removeAttach,renderAttached,setTheme,toggleNotifications,toggleSounds,clearAllLocalData,settingsBack};
  $('googleBtn').addEventListener('click',loginDemo);$('accountBtn').addEventListener('click',()=>setView('settings'));$('closeSidebar').addEventListener('click',toggleSidebar);$('headNew').addEventListener('click',createChat);$('newChatBtn').addEventListener('click',createChat);$('logoutBtn').addEventListener('click',logout);
  document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  setInterval(()=>{ if(state.user){ ensureQuota(); refreshQuotaUI(); } }, 1000);
  applyTheme();
  if(state.user) enter();
})();
</script>
</body>
</html>
